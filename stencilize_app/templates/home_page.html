

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posterize Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .preview-image {
            max-width: 20%;
            height: auto;
            margin-top: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 5px;
        }
        .illustration {
            max-width: 30px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body class="container py-4">

    <h1 class="mb-4">Posterize Image Generator</h1>
    <form method="POST" action="/" enctype="multipart/form-data" class="row g-4">

        <!-- Image Upload -->
        <div class="col-12">
            <label for="image" class="form-label">Upload Image</label>
            <input class="form-control" type="file" name="image_file" id="image_file" required>
        </div>

        <!-- Tiling Options -->
        <div class="col-12">

            <label class="form-label">Tiling</label>
            <div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="tiling" value="1" id="tiling1" checked>
                    <label class="form-check-label" for="tiling1">One Page</label>
                    <img src="{{ url_for('static', filename='tiling1.png') }}" class="illustration">
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="tiling" value="2" id="tiling2">
                    <label class="form-check-label" for="tiling2">Two Page Tiling</label>
                    <img src="{{ url_for('static', filename='tiling2.png') }}" class="illustration">
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="tiling" value="4" id="tiling4">
                    <label class="form-check-label" for="tiling4">2x2 Page Tiling</label>
                    <img src="{{ url_for('static', filename='tiling4.png') }}" class="illustration">
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="tiling" value="6" id="tiling6">
                    <label class="form-check-label" for="tiling6">3x2 Page Tiling</label>
                    <img src="{{ url_for('static', filename='tiling6.png') }}" class="illustration">
                </div>
            </div>

        </div>

        <!-- Paper Size -->
        <div class="col-12">
            <label class="form-label">Paper Size</label><br>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="paper_size" value="Letter" checked>
                <label class="form-check-label">Letter (216 × 279 mm)</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="paper_size" value="A4">
                <label class="form-check-label">A4 (210 × 297 mm)</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="paper_size" value="DoubleLetter">
                <label class="form-check-label">Double Letter (432 × 279 mm)</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="paper_size" value="A3">
                <label class="form-check-label">A3 (297 × 420 mm)</label>
            </div>
        </div>

        <!-- Blurring Level -->
        <div class="col-12">
            <label for="blurring" class="form-label">Blurring Level</label>
            <select class="form-select" name="blurring" id="blurring">
                <option value="1">1 - No Blur</option>
                <option value="3" selected>3 - Low Blur</option>
                <option value="5">5 - Medium Blur</option>
                <option value="7">7 - High Blur</option>
            </select>
        </div>

        <!-- Layers with Preview -->
        <div class="col-12">
            <label for="layers" class="form-label">Layers</label>
            <select class="form-select" name="layers" id="layers">
                <option value="1">1 Layer</option>
                <option value="2">2 Layers</option>
                <option value="3">3 Layers</option>
                <option value="4">4 Layers</option>
                <option value="5">5 Layers</option>
            </select>
            <img id="layerPreview" class="preview-image" src="/static/layers/layer_1.png" alt="Layer Preview" style="max">
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Generate Poster</button>
        </div>
    </form>

    <script>
        // Layer preview logic
        document.getElementById('layers').addEventListener('change', function() {
            const value = this.value;
            const previewImg = document.getElementById('layerPreview');
            previewImg.src = `/static/layers/layer_${value}.png`;
        });
    </script>

</body>
</html>
